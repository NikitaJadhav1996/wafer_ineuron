stages:
    preprocess_data:
          cmd:
              - python data/preprocess_save.py --config=params.yaml
          deps:
              - data/get_data.py
              - data/preprocess_save.py
              - data_given/winequality.csv         
          outs:
              - data/raw/winequality.csv
          
    train_test:
          cmd:
              - python data/train_test.py
          
          deps:
              - data/get_data.py
              - data/train_test.py
              - data/raw/winequality.csv
            
          outs:
              - data/processed/train_winequality.csv
              - data/processed/test_winequality.csv

    train_eval_model:
          cmd:
              - python models/train_eval_model.py --config params.yaml

          deps: 
              - models/train_eval_model.py
              - data/get_data.py
              - data/processed/train_winequality.csv
              - data/processed/test_winequality.csv

          params:
              - estimators.ElasticNet.params.alpha
              - estimators.ElasticNet.params.l1_ratio

          metrics:
              - models/reports/params.json:
                  cache: False
                
              - models/reports/scores.json:
                  cache: False
                
          outs:
              - models/model.joblib
              